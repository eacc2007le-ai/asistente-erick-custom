<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erick Custom Cars</title>
    <style>
        body {
            /* AQUÍ SE COLOCA EL FONDO */
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.pexels.com/photos/3311574/pexels-photo-3311574.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #chat-container {
            width: 90%;
            max-width: 400px;
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid #c40a0a;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(196, 10, 10, 0.5);
        }

        .btn-main {
            background: #c40a0a;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            margin-top: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: none;
            box-sizing: border-box;
        }

        #box {
            height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 5px;
        }

        .msg { margin-bottom: 10px; padding: 10px; border-radius: 10px; }
        .bot { background: #333; }
        .user { background: #c40a0a; text-align: right; }
    </style>
</head>
<body>

<div id="chat-container">
    <h2 style="text-align:center; color:#c40a0a;">Erick Custom Cars</h2>
    <div id="box"></div>
    <div id="ui">
        <input type="text" id="userInput" placeholder="Tu nombre...">
        <button class="btn-main" onclick="next()">Empezar</button>
    </div>
</div>

<script>
    let step = 1;
    let info = { nombre: "", tipo: "", detalle: "", precio: "" };
    const box = document.getElementById('box');

    function add(text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerHTML = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function next() {
        const val = document.getElementById('userInput').value;
        if (val === "") return;

        if (step === 1) {
            info.nombre = val;
            add(val, 'user');
            add(`¡Hola ${val}! ¿Qué servicio buscas hoy?`, 'bot');
            document.getElementById('ui').innerHTML = `
                <button class="btn-main" onclick="setService('Radios')">Radios (9" y 10")</button>
                <button class="btn-main" onclick="setService('Faros')">Faros LED</button>
                <button class="btn-main" onclick="setService('Chapas')">Chapas y Seguros</button>
            `;
        } else if (step === 2) {
            info.detalle = val;
            add(val, 'user');
            add("¿Cuál es el valor de la inversión? ($)", 'bot');
            document.getElementById('ui').innerHTML = `
                <input type="number" id="userInput" placeholder="Ej: 45">
                <button class="btn-main" onclick="next()">Generar Reporte</button>
            `;
            step = 3;
        } else if (step === 3) {
            info.precio = val;
            add("$" + val, 'user');
            finish();
        }
    }

    function setService(s) {
        info.tipo = s;
        add(s, 'user');
        add(`¿Qué modelo o accesorio de <b>${s}</b> prefieres?`, 'bot');
        document.getElementById('ui').innerHTML = `
            <input type="text" id="userInput" placeholder="Ej: Radio de 10 pulgadas...">
            <button class="btn-main" onclick="next()">Continuar</button>
        `;
        step = 2;
    }

    function finish() {
        add("¡Todo listo! Presiona para enviar a WhatsApp.", 'bot');
        
        const msj = `*ERICK CUSTOM CARS*\n*ORDEN DE SERVICIO*\n▬▬▬▬▬▬▬▬▬▬\n👤 *Cliente:* ${info.nombre}\n🛠️ *Servicio:* ${info.tipo}\n✨ *Detalle:* ${info.detalle}\n💰 *Inversión:* $${info.precio}\n📍 *Portoviejo, Ecuador*`;

        document.getElementById('ui').innerHTML = `
            <a href="https://api.whatsapp.com/send?phone=593993331704&text=${encodeURIComponent(msj)}" target="_blank" style="text-decoration:none;">
                <button class="btn-main" style="background:#25d366;">📲 ENVIAR A WHATSAPP</button>
            </a>
            <button class="btn-main" style="background:#444;" onclick="location.reload()">Nuevo Cliente</button>
        `;
    }

    add("¡Bienvenido a <b>Erick Custom Cars</b>! ¿Cómo te llamas?", 'bot');
</script>

</body>
</html>
