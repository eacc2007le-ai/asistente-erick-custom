<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erick Custom Cars - Asistente</title>
    <style>
        :root {
            --primary: #c40a0a;
            --dark: #0a0a0a;
            --gray: #1a1a1a;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark);
            color: var(--text);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        #chat-container {
            width: 100%;
            max-width: 450px;
            background: var(--gray);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(196, 10, 10, 0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        #header {
            padding: 15px;
            text-align: center;
            background: linear-gradient(to bottom, #333, #000);
            border-bottom: 2px solid var(--primary);
        }

        #header img {
            width: 100%;
            max-height: 150px;
            object-fit: contain;
            border-radius: 10px;
        }

        #chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg { padding: 12px; border-radius: 10px; max-width: 85%; line-height: 1.4; }
        .bot { background: #333; align-self: flex-start; border-left: 4px solid var(--primary); }
        .user { background: var(--primary); align-self: flex-end; }

        .options { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        
        .btn-opt {
            background: transparent;
            color: white;
            border: 1px solid var(--primary);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-opt:hover { background: var(--primary); }

        .btn-ws {
            background: #25d366;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="header">
        <img src="https://images.pexels.com/photos/3311574/pexels-photo-3311574.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Erick Custom Cars">
        <h2 style="margin:10px 0 0 0; color:var(--primary);">ERICK CUSTOM CARS</h2>
    </div>

    <div id="chat-box" id="ui">
        <div class="msg bot">
            ¡Hola! Bienvenido al asistente de <b>Erick Custom Cars</b> en Portoviejo. 🛠️🚗<br><br>
            ¿En qué servicio estás interesado hoy?
            <div class="options" id="main-options">
                <button class="btn-opt" onclick="showModels('Radios')">📻 Radios (9", 10", etc.)</button>
                <button class="btn-opt" onclick="showModels('Faros')">💡 Faros y Luces LED</button>
                <button class="btn-opt" onclick="showModels('Seguros')">⚡ Seguros Eléctricos</button>
                <button class="btn-opt" onclick="showModels('Chapas')">🔒 Chapas de Puertas</button>
            </div>
        </div>
    </div>
</div>

<script>
    let serviceType = "";
    let selectedModel = "";

    function showModels(type) {
        serviceType = type;
        const chatBox = document.getElementById('chat-box');
        
        // Quitar opciones principales
        document.getElementById('main-options').style.display = 'none';

        // Mensaje del usuario
        chatBox.innerHTML += `<div class="msg user">Me interesan: ${type}</div>`;

        let models = "";
        if(type === 'Radios') {
            models = `
                <button class="btn-opt" onclick="finalize('Radio de 9 Pulgadas')">Pantalla de 9"</button>
                <button class="btn-opt" onclick="finalize('Radio de 10 Pulgadas')">Pantalla de 10"</button>
                <button class="btn-opt" onclick="finalize('Radio con Cámara')">Radio + Cámara Reversa</button>
            `;
        } else if(type === 'Faros') {
            models = `
                <button class="btn-opt" onclick="finalize('Faros LED Turbo')">Faros LED Turbo</button>
                <button class="btn-opt" onclick="finalize('Ojos de Ángel')">Ojos de Ángel</button>
                <button class="btn-opt" onclick="finalize('Cinta LED DRL')">Cinta LED DRL</button>
            `;
        } else if(type === 'Seguros') {
            models = `
                <button class="btn-opt" onclick="finalize('Kit de 4 Puertas')">Kit para 4 Puertas</button>
                <button class="btn-opt" onclick="finalize('Módulo Alza Vidrios')">Módulo Alza Vidrios</button>
            `;
        } else if(type === 'Chapas') {
            models = `
                <button class="btn-opt" onclick="finalize('Chapa Lado Chofer')">Lado Chofer</button>
                <button class="btn-opt" onclick="finalize('Juego Completo')">Juego de Chapas Completo</button>
            `;
        }

        setTimeout(() => {
            chatBox.innerHTML += `
                <div class="msg bot">
                    Excelente. ¿Qué modelo o variante prefieres?
                    <div class="options">${models}</div>
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;
        }, 500);
    }

    function finalize(model) {
        selectedModel = model;
        const chatBox = document.getElementById('chat-box');
        
        chatBox.innerHTML += `<div class="msg user">Prefiero: ${model}</div>`;

        const msj = `*ERICK CUSTOM CARS*
*CONSULTA DE SERVICIO*
---------------------------
🛠️ *Categoría:* ${serviceType}
✨ *Modelo:* ${selectedModel}
📍 *Portoviejo, Ecuador*`;

        setTimeout(() => {
            chatBox.innerHTML += `
                <div class="msg bot">
                    ¡Perfecto! Ya tengo la información. Presiona abajo para enviármela por WhatsApp y darte el precio final.
                    <a href="https://api.whatsapp.com/send?phone=593993331704&text=${encodeURIComponent(msj)}" class="btn-ws">
                        📲 ENVIAR A WHATSAPP
                    </a>
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;
        }, 500);
    }
</script>

</body>
</html>
