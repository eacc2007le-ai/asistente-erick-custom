<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erick Custom - Luxury Assistant</title>
    <style>
        :root { --neon: #00ff88; --bg: #0b0f1a; --card: #161b2c; --text: #f8fafc; --admin: #3b82f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        .header { background: var(--card); padding: 15px; text-align: center; border-bottom: 3px solid var(--neon); box-shadow: 0 4px 20px rgba(0,255,136,0.15); }
        .header h1 { margin: 0; font-size: 1.1rem; color: var(--neon); letter-spacing: 2px; text-transform: uppercase; }

        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        
        .bubble { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .bot { background: var(--card); align-self: flex-start; border-left: 4px solid var(--neon); border-bottom-left-radius: 2px; }
        .user { background: var(--neon); color: #000; align-self: flex-end; border-bottom-right-radius: 2px; font-weight: 600; }
        .admin-msg { background: var(--admin); color: white; align-self: flex-start; border-left: 4px solid #fff; border-bottom-left-radius: 2px; font-style: italic; }

        .report { background: #000; border: 1px solid var(--neon); padding: 15px; border-radius: 12px; font-family: monospace; color: var(--neon); margin-top: 10px; border-left: 5px solid var(--neon); }

        .ui-area { background: var(--card); padding: 20px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #2d3748; }
        input { background: #0b0f1a; border: 1px solid #2d3748; color: white; padding: 14px; border-radius: 12px; outline: none; font-size: 16px; }
        .btn-main { background: var(--neon); color: black; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 1rem; cursor: pointer; text-decoration: none; text-align: center; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .opt-btn { background: rgba(255,255,255,0.05); border: 1px solid #2d3748; color: white; padding: 12px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="header">
        <h1>ERICK CUSTOM CARS</h1>
    </div>

    <div id="chat-box"></div>

    <div class="ui-area" id="ui">
        <input type="text" id="userInput" placeholder="Nombre del cliente...">
        <button class="btn-main" onclick="next()">Iniciar Asesoría</button>
    </div>

    <script>
        let step = 0;
        let info = { nombre: "", tipo: "", detalle: "", precio: "" };
        const box = document.getElementById('chat-box');

        function add(txt, type) {
            const d = document.createElement('div');
            d.className = `bubble ${type}`;
            d.innerHTML = txt;
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
        }

        const greeting = () => {
            const h = new Date().getHours();
            return h < 12 ? "Buenos días" : h < 19 ? "Buenas tardes" : "Buenas noches";
        };

        function next() {
            const input = document.getElementById('userInput');
            const val = input.value.trim();
            if(!val) return;

            if(step === 0 || step === 2) add(val, 'user');
            if(step === 3) add("Precio fijado: $" + val, 'admin-msg');
            
            input.value = "";

            setTimeout(() => {
                if(step === 0) {
                    info.nombre = val;
                    add(`¡${greeting()}! Un gusto atenderle <b>${val}</b>. <br><br>¿En qué podemos ayudarle hoy?`, 'bot');
                    document.getElementById('ui').innerHTML = `
                        <div class="options">
                            <div class="opt-btn" onclick="setService('Arreglo Manual')">🛠️ Arreglo Manual</div>
                            <div class="opt-btn" onclick="setService('Cambio de Accesorios')">✨ Cambio de Accesorios</div>
                        </div>
                    `;
                    step = 1;
                } else if(step === 2) {
                    info.detalle = val;
                    add(`👨‍🔧 <b>ESPERA: MODO ERICK</b><br>Ingresa el precio acordado para este trabajo:`, 'admin-msg');
                    document.getElementById('ui').innerHTML = `
                        <input type="number" id="userInput" placeholder="Monto en $ (Ej: 45)...">
                        <button class="btn-main" style="background:#3b82f6; color:white;" onclick="next()">Generar Reporte Final</button>
                    `;
                    step = 3;
                } else if(step === 3) {
                    info.precio = val;
                    finish();
                }
            }, 500);
        }

        function setService(s) {
            info.tipo = s;
            add(s, 'user');
            setTimeout(() => {
                add(s === 'Arreglo Manual' ? "¿Qué reparación necesita su vehículo?" : "¿Qué accesorios le gustaría instalar?", 'bot');
                document.getElementById('ui').innerHTML = `
                    <input type="text" id="userInput" placeholder="Ej: Chapas de puertas, Luces LED...">
                    <button class="btn-main" onclick="next()">Continuar</button>
                `;
                step = 2;
            }, 500);
        }

        function finish() {
            add("¡Excelente! Todo está listo. Presione el botón verde para enviar el presupuesto al cliente.", 'bot');
            
            const msj = const msj = `*ERICK CUSTOM CARS*
*ORDEN DE SERVICIO*
---------------------------
👤 *Cliente:* ${info.nombre}
🛠️ *Servicio:* ${info.tipo}
✨ *Detalle:* ${info.detalle}
💰 *Inversión:* $${info.precio}
📍 *Portoviejo, Ecuador*`;


            const card = document.createElement('div');
            card.className = "report";
            card.innerHTML = `🏁 <b>RESUMEN DE VENTA</b><br>CLIENTE: ${info.nombre}<br>TRABAJO: ${info.detalle}<br>TOTAL: $${info.precio}`;
            box.appendChild(card);

              document.getElementById('ui').innerHTML = `
        <a href="https://api.whatsapp.com/send?phone=593993331704&text=${encodeURIComponent(msj)}" target="_blank" class="btn-main" style="background:#25d366; text-decoration:none; display:block; text-align:center; color:white; padding:15px; border-radius:8px; font-weight:bold;">
            📲 ENVIAR A WHATSAPP
        </a>
        <button class="opt-btn" style="margin-top:10px; width:100%; padding:10px;" onclick="location.reload()">Nuevo Cliente</button>
        
  
            `;
            box.scrollTop = box.scrollHeight;
        }

        add(`¡Hola! Bienvenido a <b>Erick Custom Cars</b>. ¿Cómo se llama el cliente?`, 'bot');
    </script>
</body>
</html>
